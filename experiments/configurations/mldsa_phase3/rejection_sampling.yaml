# Experiment Configuration: ML-DSA Rejection Sampling & Norm Checks
experiment_id: EXP-MLDSA-REJECTION-04
purpose: "Evaluate norm check bypass and forced rejection exhaustion in ML-DSA signing loop"
standards: ["NIST FIPS 204"]
algorithms: ["ML-DSA-44", "ML-DSA-65", "ML-DSA-87"]
implementation: "mldsa-native (14d195a82dd2)"
seed: 1122334455
trials: 1000
test_cases:
  - name: "NORM_Z_FORCED_PASS"
    description: "Force norm check on z to pass (bypassing ||z||_inf >= gamma1 - beta bound)"
    expected_signing: "SUCCESS"
    expected_verify: "INVALID_SIGNATURE"
  - name: "NORM_Z_FORCED_REJECT"
    description: "Force norm check on z to fail (inducing signing retry exhaustion and DoS)"
    expected_signing: "SIGN_ATTEMPTS_EXHAUSTED"
  - name: "NORM_W0_FORCED_PASS"
    description: "Force low-bits check w0 to pass (bypassing ||w0 - cs2||_inf >= gamma2 - beta)"
output_path: "results/phase3/raw/rejection_sampling.json"

# Experiment Configuration: Secret Key Memory Region Decomposition
experiment_id: EXP-SK-REGIONS-06
purpose: "Evaluate structural memory fault sensitivity across serialized decapsulation key components: s, pk, H(pk), z"
standards: ["NIST FIPS 203"]
algorithms: ["ML-KEM-512", "ML-KEM-768", "ML-KEM-1024"]
implementation: "mlkem-native (fc269bc2d106)"
seed: 3344556677
trials: 1000
regions:
  - name: "REGION_S"
    description: "Private polynomial vector coefficients s"
    expected_outcome: "IMPLICIT_REJECTION"
  - name: "REGION_PK"
    description: "Embedded public key bytes pk"
    expected_outcome: "EXPLICIT_ERROR"
  - name: "REGION_HPK"
    description: "Cached SHA3-256 hash of public key H(pk)"
    expected_outcome: "EXPLICIT_ERROR"
  - name: "REGION_Z"
    description: "Implicit rejection PRF seed z"
    expected_outcome: "CORRECT"
fault_types:
  - type: "BIT_FLIP"
    bit: 0
output_path: "results/phase2/raw/secret_state_faults.json"

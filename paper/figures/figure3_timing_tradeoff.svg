<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="425" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Performance and Latency Overhead Trade-off</text>
  <text x="425" y="54" text-anchor="middle" font-size="12" fill="#64748b">Measured Decapsulation Latency on Apple M3 Pro (N = 2,000, 5,000 Warmup Iterations)</text>

  <!-- Bar Chart Axes -->
  <line x1="120" y1="340" x2="780" y2="340" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="120" y1="100" x2="120" y2="340" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Y-Axis Ticks & Grid Lines -->
  <!-- 0 us -->
  <text x="105" y="345" text-anchor="end" font-size="11" fill="#64748b">0 µs</text>
  
  <!-- 100 us -->
  <line x1="120" y1="260" x2="780" y2="260" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="105" y="264" text-anchor="end" font-size="11" fill="#64748b">100 µs</text>

  <!-- 200 us -->
  <line x1="120" y1="180" x2="780" y2="180" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="105" y="184" text-anchor="end" font-size="11" fill="#64748b">200 µs</text>

  <!-- 300 us -->
  <line x1="120" y1="100" x2="780" y2="100" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="105" y="104" text-anchor="end" font-size="11" fill="#64748b">300 µs</text>

  <!-- Bars for -O3 -->
  <!-- Baseline -O3: 110.77 us -> height: 110.77 * 0.8 = 88.6px -> y: 340 - 88.6 = 251.4 -->
  <rect x="180" y="251" width="65" height="89" rx="4" fill="#64748b"/>
  <text x="212" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">110.8 µs</text>

  <!-- Proposed -O3: 129.51 us -> height: 129.51 * 0.8 = 103.6px -> y: 340 - 103.6 = 236.4 -->
  <rect x="260" y="236" width="65" height="104" rx="4" fill="#3b82f6"/>
  <text x="292" y="227" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">129.5 µs</text>
  <text x="292" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+16.9%</text>

  <!-- DMR -O3: 260.68 us -> height: 260.68 * 0.8 = 208.5px -> y: 340 - 208.5 = 131.5 -->
  <rect x="340" y="131" width="65" height="209" rx="4" fill="#ef4444"/>
  <text x="372" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">260.7 µs</text>
  <text x="372" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+135.3%</text>

  <text x="292" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">-O3 Optimization Flags</text>

  <!-- Bars for -O2 -->
  <!-- Baseline -O2: 124.30 us -> height: 124.3 * 0.8 = 99.4px -> y: 340 - 99.4 = 240.6 -->
  <rect x="490" y="240" width="65" height="100" rx="4" fill="#64748b"/>
  <text x="522" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">124.3 µs</text>

  <!-- Proposed -O2: 155.75 us -> height: 155.75 * 0.8 = 124.6px -> y: 340 - 124.6 = 215.4 -->
  <rect x="570" y="215" width="65" height="125" rx="4" fill="#3b82f6"/>
  <text x="602" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">155.8 µs</text>
  <text x="602" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+25.3%</text>

  <!-- DMR -O2: 309.51 us -> height: 309.51 * 0.8 = 247.6px -> y: 340 - 247.6 = 92.4 -->
  <rect x="650" y="92" width="65" height="248" rx="4" fill="#ef4444"/>
  <text x="682" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">309.5 µs</text>
  <text x="682" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+149.0%</text>

  <text x="602" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">-O2 Optimization Flags</text>

  <!-- Legend -->
  <rect x="250" y="395" width="16" height="16" rx="3" fill="#64748b"/>
  <text x="272" y="408" font-size="11" fill="#334155">Native Baseline</text>

  <rect x="385" y="395" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="407" y="408" font-size="11" fill="#334155">Invariant Monitored + Rollback (This Work)</text>

  <rect x="660" y="395" width="16" height="16" rx="3" fill="#ef4444"/>
  <text x="682" y="408" font-size="11" fill="#334155">Software Sequential DMR</text>
</svg>

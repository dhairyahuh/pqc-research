name: ASTRA-Sec CI Pipeline

on:
  push:
    branches: [ "main", "astra-sec" ]
  pull_request:
    branches: [ "main", "astra-sec" ]

jobs:
  c-kat-verification:
    name: C Engine & NIST FIPS KATs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install C Toolchain and LibOQS
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang liboqs-dev

      - name: Build C Verification Targets
        run: |
          make bin/test_fips_kats bin/test_interop

      - name: Run NIST FIPS 203 & 204 KAT Verification
        run: |
          ./bin/test_fips_kats

      - name: Run Cross-Engine Interoperability Test
        run: |
          ./bin/test_interop

  python-test-suite:
    name: Python Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic>=2.0.0
          pip install ruff || true

      - name: Run Python Linting
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check astra_sec tests
          else
            python -m py_compile astra_sec/*.py astra_sec/*/*.py tests/*/*.py
          fi

      - name: Run Python Unit Tests
        run: |
          python -m unittest discover -s tests/unit -v

      - name: Run Python Integration Tests
        run: |
          python -m unittest discover -s tests/integration -v

      - name: Run System Diagnostic Health Check
        run: |
          python -m astra_sec.app health
